apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: citeshield-api
  namespace: monitoring
  labels:
    app.kubernetes.io/name: citeshield
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    matchNames:
      - rag-app
  selector:
    matchLabels:
      app.kubernetes.io/name: citeshield
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
