apiVersion: v1
kind: Secret
metadata:
  name: citeshield-app-secrets
  namespace: rag-app
type: Opaque
stringData:
  TENANT_A_API_KEY: "<set-tenant-a-key>"
  TENANT_B_API_KEY: "<set-tenant-b-key>"
  SUPERUSER_API_KEY: "<set-superuser-key>"
  GEMINI_API_KEY: "<optional-when-generator-backend-is-gemini>"
  OPENAI_COMPATIBLE_API_KEY: "<optional-openai-compatible-key>"
  QDRANT_API_KEY: "<optional-for-remote-qdrant>"
