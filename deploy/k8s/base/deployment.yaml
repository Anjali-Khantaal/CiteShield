apiVersion: apps/v1
kind: Deployment
metadata:
  name: citeshield-api
  namespace: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: citeshield
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: citeshield
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/anjali-khantaal/citeshield-api:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: citeshield-app-config
            - secretRef:
                name: citeshield-app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citeshield-qdrant
  namespace: vector-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: citeshield
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: citeshield
        app.kubernetes.io/component: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.11.3
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
