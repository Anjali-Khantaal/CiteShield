apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: citeshield-api
  namespace: rag-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: citeshield-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
