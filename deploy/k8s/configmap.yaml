apiVersion: v1
kind: ConfigMap
metadata:
  name: citeshield-app-config
  namespace: rag-app
  labels:
    app.kubernetes.io/name: citeshield
    app.kubernetes.io/component: api
data:
  APP_NAME: CiteShield
  EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
  EMBEDDING_BATCH_SIZE: "32"
  EMBEDDING_MODEL_CACHE_DIR: /models
  EMBEDDING_VECTOR_SIZE: "384"
  CHUNK_SIZE_CHARS: "700"
  RETRIEVAL_TOP_K: "3"
  GENERATOR_BACKEND: extractive
  GENERATOR_MIN_SCORE_THRESHOLD: "0.15"
  GENERATOR_MIN_TERM_OVERLAP: "2"
  GENERATOR_MAX_SENTENCES: "2"
  FEATURE_STRICT_GROUNDING: "true"
  QDRANT_HOST: citeshield-qdrant.vector-db.svc.cluster.local
  QDRANT_HTTP_PORT: "6333"
  QDRANT_GRPC_PORT: "6334"
  QDRANT_COLLECTION_NAME: documents
  QDRANT_PREFER_GRPC: "false"
  QDRANT_TIMEOUT_SECONDS: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: citeshield-tenant-a-overlay
  namespace: tenant-a
  labels:
    app.kubernetes.io/name: citeshield
    citeshield.dev/tenant: tenant_a
data:
  TENANT_ID: tenant_a
  TENANT_DISPLAY_NAME: Tenant A
  TOP_K_OVERRIDE: "3"
  FEATURE_STRICT_GROUNDING: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: citeshield-tenant-b-overlay
  namespace: tenant-b
  labels:
    app.kubernetes.io/name: citeshield
    citeshield.dev/tenant: tenant_b
data:
  TENANT_ID: tenant_b
  TENANT_DISPLAY_NAME: Tenant B
  TOP_K_OVERRIDE: "3"
  FEATURE_STRICT_GROUNDING: "true"
