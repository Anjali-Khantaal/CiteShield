services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ../../.env
    environment:
      APP_NAME: CiteShield
      QDRANT_HOST: qdrant
      QDRANT_HTTP_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      EMBEDDING_MODEL_CACHE_DIR: /models
      GENERATOR_BACKEND: ${GENERATOR_BACKEND:-gemini}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-2.5-flash}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-300}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      TENANT_A_API_KEY: tenant-a-dev-key
      TENANT_B_API_KEY: tenant-b-dev-key
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model_cache:/models
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  model_cache:
  qdrant_storage:
