<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Ingestion flow</title>
  <desc id="desc">Sequence diagram for tenant-aware document ingestion from client request through authentication, parsing, embeddings, and vector upsert.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .headA { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .headB { fill: #ecfccb; stroke: #65a30d; stroke-width: 2; }
      .headC { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .step { font: 600 14px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .line { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
      .msg { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .reply { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow2); }
      .bubble { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 10; ry: 10; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="460" rx="26" ry="26"/>
  <text class="title" x="40" y="44">Ingestion Flow</text>

  <rect class="headA" x="56" y="72" width="170" height="44" rx="16" ry="16"/>
  <rect class="headA" x="282" y="72" width="190" height="44" rx="16" ry="16"/>
  <rect class="headB" x="520" y="72" width="160" height="44" rx="16" ry="16"/>
  <rect class="headB" x="746" y="72" width="190" height="44" rx="16" ry="16"/>
  <rect class="headC" x="1006" y="72" width="170" height="44" rx="16" ry="16"/>
  <rect class="headC" x="1212" y="72" width="130" height="44" rx="16" ry="16"/>

  <text class="label" x="141" y="94">Tenant Client</text>
  <text class="label" x="377" y="94">FastAPI /ingest</text>
  <text class="label" x="600" y="94">Auth Layer</text>
  <text class="label" x="841" y="94">Parser + Chunker</text>
  <text class="label" x="1091" y="94">Embedding Model</text>
  <text class="label" x="1277" y="94">Qdrant</text>

  <line class="line" x1="141" y1="116" x2="141" y2="420"/>
  <line class="line" x1="377" y1="116" x2="377" y2="420"/>
  <line class="line" x1="600" y1="116" x2="600" y2="420"/>
  <line class="line" x1="841" y1="116" x2="841" y2="420"/>
  <line class="line" x1="1091" y1="116" x2="1091" y2="420"/>
  <line class="line" x1="1277" y1="116" x2="1277" y2="420"/>

  <path class="msg" d="M 141 156 H 377"/>
  <rect class="bubble" x="182" y="136" width="150" height="28"/>
  <text class="step" x="194" y="154">1. POST /ingest + document</text>

  <path class="msg" d="M 377 194 H 600"/>
  <rect class="bubble" x="430" y="174" width="120" height="28"/>
  <text class="step" x="442" y="192">2. Validate API key</text>

  <path class="reply" d="M 600 232 H 377"/>
  <rect class="bubble" x="420" y="212" width="134" height="28"/>
  <text class="step" x="432" y="230">3. tenant_id resolved</text>

  <path class="msg" d="M 377 270 H 841"/>
  <rect class="bubble" x="510" y="250" width="190" height="28"/>
  <text class="step" x="522" y="268">4. Extract text and chunk document</text>

  <path class="reply" d="M 841 308 H 377"/>
  <rect class="bubble" x="532" y="288" width="166" height="28"/>
  <text class="step" x="544" y="306">5. chunks + metadata</text>

  <path class="msg" d="M 377 346 H 1091"/>
  <rect class="bubble" x="656" y="326" width="120" height="28"/>
  <text class="step" x="668" y="344">6. Embed chunks</text>

  <path class="reply" d="M 1091 384 H 377"/>
  <rect class="bubble" x="740" y="364" width="92" height="28"/>
  <text class="step" x="752" y="382">7. vectors</text>

  <path class="msg" d="M 377 408 H 1277"/>
  <rect class="bubble" x="684" y="397" width="286" height="28"/>
  <text class="step" x="696" y="415">8. Upsert tenant_id, doc_id, chunk_id, source</text>

  <path class="reply" d="M 1277 440 H 141"/>
  <rect class="bubble" x="666" y="429" width="132" height="28"/>
  <text class="step" x="678" y="447">9. ingestion summary</text>
</svg>
