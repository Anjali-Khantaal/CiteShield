<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
  <title id="title">CiteShield system overview</title>
  <desc id="desc">High-level architecture showing clients, FastAPI service, application services, storage, observability, and deployment layers.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panel-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .node { stroke-width: 2; rx: 16; ry: 16; }
      .client { fill: #e0f2fe; stroke: #0284c7; }
      .api { fill: #dbeafe; stroke: #2563eb; }
      .core { fill: #ecfccb; stroke: #65a30d; }
      .store { fill: #f5f3ff; stroke: #7c3aed; }
      .obs { fill: #fef3c7; stroke: #d97706; }
      .plat { fill: #fce7f3; stroke: #db2777; }
      .label { font: 600 15px Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 600 13px Arial, Helvetica, sans-serif; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .subtle { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowheadLight); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowheadLight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1400" height="960" rx="28" ry="28"/>

  <rect class="panel" x="40" y="36" width="230" height="160" rx="22" ry="22"/>
  <text class="panel-title" x="64" y="72">Clients</text>
  <rect class="node client" x="68" y="98" width="174" height="34"/>
  <text class="label small" x="155" y="115">Tenant A Client</text>
  <rect class="node client" x="68" y="144" width="174" height="34"/>
  <text class="label small" x="155" y="161">Tenant B Client</text>

  <rect class="panel" x="320" y="36" width="530" height="250" rx="22" ry="22"/>
  <text class="panel-title" x="344" y="72">FastAPI RAG Service</text>
  <rect class="node api" x="352" y="104" width="160" height="42"/>
  <text class="label" x="432" y="125">API Router</text>
  <rect class="node api" x="550" y="104" width="246" height="42"/>
  <text class="label" x="673" y="125">API Key Auth - key to tenant_id</text>
  <rect class="node api" x="352" y="178" width="124" height="40"/>
  <text class="label small" x="414" y="198">POST /ingest</text>
  <rect class="node api" x="492" y="178" width="124" height="40"/>
  <text class="label small" x="554" y="198">POST /query</text>
  <rect class="node api" x="632" y="178" width="124" height="40"/>
  <text class="label small" x="694" y="198">GET /health</text>
  <rect class="node api" x="772" y="178" width="124" height="40"/>
  <text class="label small" x="834" y="198">GET /metrics</text>

  <rect class="panel" x="320" y="330" width="530" height="278" rx="22" ry="22"/>
  <text class="panel-title" x="344" y="366">Application Services</text>
  <rect class="node core" x="352" y="398" width="154" height="42"/>
  <text class="label" x="429" y="419">Document Parser</text>
  <rect class="node core" x="532" y="398" width="154" height="42"/>
  <text class="label" x="609" y="419">Chunking Service</text>
  <rect class="node core" x="712" y="398" width="106" height="42"/>
  <text class="label" x="765" y="419">Embeddings</text>
  <rect class="node core" x="352" y="478" width="154" height="42"/>
  <text class="label" x="429" y="499">Retriever</text>
  <rect class="node core" x="532" y="478" width="154" height="42"/>
  <text class="label" x="609" y="499">Generator</text>
  <rect class="node core" x="712" y="478" width="106" height="42"/>
  <text class="label" x="765" y="499">Citations</text>

  <rect class="panel" x="900" y="36" width="460" height="360" rx="22" ry="22"/>
  <text class="panel-title" x="924" y="72">Data Layer</text>
  <rect class="node store" x="936" y="106" width="170" height="46"/>
  <text class="label" x="1021" y="129">Raw Docs Storage</text>
  <rect class="node store" x="1128" y="106" width="198" height="46"/>
  <text class="label small" x="1227" y="124">Qdrant</text>
  <text class="label small" x="1227" y="140">single collection + tenant_id filter</text>
  <rect class="node store" x="936" y="190" width="170" height="46"/>
  <text class="label" x="1021" y="213">Config / Settings</text>
  <rect class="node store" x="1128" y="190" width="198" height="46"/>
  <text class="label" x="1227" y="213">Secrets / API Keys</text>

  <rect class="panel" x="900" y="438" width="460" height="188" rx="22" ry="22"/>
  <text class="panel-title" x="924" y="474">Observability</text>
  <rect class="node obs" x="946" y="520" width="174" height="44"/>
  <text class="label" x="1033" y="542">Prometheus Scrape</text>
  <rect class="node obs" x="1152" y="520" width="174" height="44"/>
  <text class="label" x="1239" y="542">Dashboards / Logs</text>

  <rect class="panel" x="40" y="650" width="1320" height="250" rx="22" ry="22"/>
  <text class="panel-title" x="64" y="688">Container + Infra</text>
  <rect class="node plat" x="88" y="734" width="176" height="46"/>
  <text class="label" x="176" y="757">Docker / Compose</text>
  <rect class="node plat" x="302" y="734" width="176" height="46"/>
  <text class="label" x="390" y="757">Kubernetes</text>
  <rect class="node plat" x="516" y="734" width="176" height="46"/>
  <text class="label" x="604" y="757">Namespace tenant-a</text>
  <rect class="node plat" x="730" y="734" width="176" height="46"/>
  <text class="label" x="818" y="757">Namespace tenant-b</text>
  <rect class="node plat" x="944" y="734" width="176" height="46"/>
  <text class="label" x="1032" y="757">GitHub Actions</text>
  <rect class="node plat" x="1158" y="734" width="150" height="46"/>
  <text class="label" x="1233" y="757">CI / CD</text>

  <path class="arrow" d="M 242 115 C 285 115, 308 115, 352 125"/>
  <path class="arrow" d="M 242 161 C 285 161, 308 145, 352 125"/>

  <path class="arrow" d="M 512 125 L 550 125"/>
  <path class="arrow" d="M 673 146 L 414 178"/>
  <path class="arrow" d="M 673 146 L 554 178"/>
  <path class="subtle" d="M 432 146 L 432 178"/>
  <path class="subtle" d="M 432 218 L 429 398"/>
  <path class="subtle" d="M 554 218 L 429 478"/>
  <path class="subtle" d="M 554 218 L 609 478"/>
  <path class="subtle" d="M 834 218 L 1033 520"/>

  <path class="arrow" d="M 506 419 L 532 419"/>
  <path class="arrow" d="M 686 419 L 712 419"/>
  <path class="arrow" d="M 429 520 L 532 520"/>
  <path class="arrow" d="M 686 499 L 712 499"/>
  <path class="arrow" d="M 818 419 C 860 419, 880 200, 1128 129"/>
  <path class="arrow" d="M 429 419 C 820 419, 870 129, 936 129"/>
  <path class="arrow" d="M 429 499 C 820 499, 870 152, 1128 129"/>

  <path class="subtle" d="M 1106 213 L 550 125"/>
  <path class="subtle" d="M 1128 213 C 980 213, 920 499, 686 499"/>
  <path class="subtle" d="M 936 213 C 760 213, 660 125, 512 125"/>
