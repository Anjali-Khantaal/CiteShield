  <path class="arrow" d="M 176 734 C 176 640, 308 630, 432 286"/>
  <path class="arrow" d="M 176 734 C 176 620, 880 580, 1128 152"/>
  <path class="arrow" d="M 390 734 C 390 620, 470 600, 500 286"/>
  <path class="arrow" d="M 390 734 C 390 615, 980 602, 1180 152"/>
  <path class="subtle" d="M 390 780 L 604 780"/>
  <path class="subtle" d="M 390 780 L 818 780"/>
  <path class="arrow" d="M 1032 734 C 1032 690, 980 675, 176 780"/>
  <path class="arrow" d="M 1032 734 C 1032 690, 1010 675, 390 780"/>
  <path class="subtle" d="M 1032 780 L 1233 780"/>
</svg>
